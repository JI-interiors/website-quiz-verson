<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet"><meta name="googlebot-news" content="noindex,nofollow,noarchive,nosnippet"><title>Linva Interiors CRM</title><style>
:root{--pink:#c9005b;--dark:#321024;--gold:#d9a13a;--bg:#fbf8f9;--line:#eadfe5;--muted:#806d77}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}.shell{min-height:100vh;display:flex}.side{width:240px;background:#fff;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column}.logo{padding:8px;border-radius:14px;background:#fff;box-shadow:0 8px 24px #32102412}.logo img{width:100%;display:block}.nav{margin-top:24px;display:grid;gap:7px}.nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;font-weight:800;color:var(--muted);cursor:pointer}.nav button.active,.nav button:hover{background:#fff0f6;color:var(--pink)}.back{margin-top:auto;color:var(--pink);text-decoration:none;font-weight:800;font-size:12px}.main{flex:1;padding:26px;max-width:1450px;margin:auto;width:100%}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.ey{font-size:10px;letter-spacing:.18em;color:var(--gold);font-weight:900}.head h1{margin:5px 0 0;font:32px Georgia,serif}.btn{border:0;background:var(--pink);color:#fff;border-radius:10px;padding:11px 15px;font-weight:900;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 35px #3210240b}.stat{padding:16px}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{display:block;font-size:27px;margin-top:4px}.card{padding:18px}.toolbar{display:flex;gap:9px;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.toolbar input{flex:1}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:left}th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}td{font-size:12px}.priority.high{color:#c21d38;font-weight:900}.priority.medium{color:#a36e0d;font-weight:900}.priority.low{color:#37825b;font-weight:900}.badge{display:inline-block;background:#f7eff4;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:800}.actions{display:flex;gap:5px}.small{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:11px;font-weight:800;cursor:pointer}.empty{text-align:center;padding:35px;color:var(--muted)}.hidden{display:none!important}.profile{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.profile div{background:#fbf5f8;border-radius:9px;padding:9px}.profile small{display:block;color:#927f88;font-size:9px;text-transform:uppercase}.profile b{font-size:12px}.modal{position:fixed;inset:0;background:#32102470;display:grid;place-items:center;padding:18px}.modalbox{background:#fff;border-radius:18px;padding:20px;width:min(700px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between}.x{border:0;background:#f6eef3;border-radius:50%;width:32px;height:32px}.details{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.details div{padding:10px;border:1px solid var(--line);border-radius:10px}.details .wide{grid-column:1/-1}@media(max-width:800px){.side{width:180px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.shell{display:block}.side{width:100%;padding:10px;border-right:0;border-bottom:1px solid var(--line)}.logo img{max-height:60px;object-fit:contain}.nav{display:flex;margin-top:9px}.nav button{flex:1;text-align:center;padding:8px;font-size:11px}.back{display:none}.main{padding:13px}.head h1{font-size:24px}.stats{gap:7px}.stat{padding:12px}.stat b{font-size:22px}.toolbar{display:grid}.profile{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside class="side"><div class="logo"><img src="../images/linva-interiors-logo.svg" alt="Linva Interiors"></div><div class="nav"><button class="active" data-view="dashboard">Dashboard</button><button data-view="leads">Leads</button><button data-view="followups">Follow-Ups</button></div><a class="back" href="../index.html">← Back to website</a></aside><main class="main"><div class="head"><div><div class="ey">LINVA INTERIORS CRM</div><h1 id="title">Lead Dashboard</h1></div><button class="btn" id="add">+ Add Lead</button></div><section id="dashboard"><div class="stats"><div class="stat"><span>Total Leads</span><b id="total">0</b></div><div class="stat"><span>Follow-Ups Today</span><b id="today">0</b></div><div class="stat"><span>Overdue</span><b id="overdue">0</b></div><div class="stat"><span>High Priority</span><b id="high">0</b></div></div><div class="card"><h2>Upcoming Follow-Ups</h2><div id="upcoming"></div></div></section><section id="leads" class="hidden"><div class="toolbar"><input id="search" placeholder="Search name, phone, location..."><select id="source"><option value="all">All sources</option><option>Website Free Home Visit</option><option>Design Discovery Quiz</option></select><select id="status"><option value="all">All statuses</option><option>pending</option><option>completed</option><option>converted</option><option>lost</option></select></div><div class="card table" id="leadTable"></div></section><section id="followups" class="hidden"><div class="toolbar"><select id="range"><option value="all">All</option><option value="today">Today</option><option value="overdue">Overdue</option><option value="next7">Next 7 days</option></select><select id="fp"><option value="all">All priorities</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></div><div class="card table" id="followTable"></div></section></main></div><div class="modal hidden" id="modal"><div class="modalbox"><div class="modalhead"><div><div class="ey">LEAD PROFILE</div><h2 id="mname"></h2></div><button class="x" id="close">×</button></div><div id="details" class="details"></div></div></div><script>
const KEY='linva_crm_leads';let leads=[];const $=id=>document.getElementById(id);const rank={high:0,medium:1,low:2};function load(){try{leads=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){leads=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(leads));render()}function dt(v){return v?new Date(v).toLocaleString([],{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}function today(v){return v&&new Date(v).toDateString()===new Date().toDateString()}function overdue(c){return c.status==='pending'&&c.followup&&new Date(c.followup)<new Date()}function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function sorted(a){return [...a].sort((x,y)=>(new Date(x.followup||'2999-01-01')-new Date(y.followup||'2999-01-01'))||rank[x.priority]-rank[y.priority])}function row(c){return `<tr><td><b>${esc(c.name)}</b><div>${esc(c.source||'')}</div></td><td>${esc(c.phone)}</td><td>${esc(c.location||c.property||c.profile?.project||'—')}</td><td><span class="priority ${c.priority}">${esc(c.priority)}</span></td><td>${dt(c.followup)}</td><td><span class="badge">${esc(c.status)}</span></td><td><div class="actions"><button class="small" onclick="openLead('${c.id}')">View</button><button class="small" onclick="done('${c.id}')">Done</button><button class="small" onclick="wa('${c.phone}','${c.name}')">WhatsApp</button></div></td></tr>`}function table(list){return list.length?`<table><thead><tr><th>Customer</th><th>WhatsApp</th><th>Project</th><th>Priority</th><th>Follow-Up</th><th>Status</th><th>Actions</th></tr></thead><tbody>${sorted(list).map(row).join('')}</tbody></table>`:'<div class="empty">No leads found.</div>'}function render(){load();$('total').textContent=leads.length;$('today').textContent=leads.filter(c=>c.status==='pending'&&today(c.followup)).length;$('overdue').textContent=leads.filter(overdue).length;$('high').textContent=leads.filter(c=>c.status==='pending'&&c.priority==='high').length;const up=sorted(leads.filter(c=>c.status==='pending'&&c.followup)).slice(0,8);$('upcoming').innerHTML=table(up);let q=($('search')?.value||'').toLowerCase(),src=$('source')?.value||'all',st=$('status')?.value||'all';$('leadTable').innerHTML=table(leads.filter(c=>(!q||[c.name,c.phone,c.location,c.property,c.message].join(' ').toLowerCase().includes(q))&&(src==='all'||c.source===src)&&(st==='all'||c.status===st)));let r=$('range')?.value||'all',fp=$('fp')?.value||'all';let f=leads.filter(c=>c.status==='pending'&&c.followup&&(fp==='all'||c.priority===fp));if(r==='today')f=f.filter(c=>today(c.followup));if(r==='overdue')f=f.filter(overdue);if(r==='next7'){let n=Date.now()+7*864e5;f=f.filter(c=>new Date(c.followup)>=new Date()&&new Date(c.followup)<=new Date(n))}$('followTable').innerHTML=table(f)}function openLead(id){const c=leads.find(x=>x.id===id);if(!c)return;$('mname').textContent=c.name;$('details').innerHTML=`<div><small>WhatsApp</small><b>${esc(c.phone)}</b></div><div><small>Source</small><b>${esc(c.source)}</b></div><div><small>Priority</small><b>${esc(c.priority)}</b></div><div><small>Status</small><b>${esc(c.status)}</b></div><div><small>Upcoming Follow-Up</small><b>${dt(c.followup)}</b></div><div><small>Last Follow-Up</small><b>${dt(c.lastFollowup)}</b></div><div class="wide"><small>Requirement</small><b>${esc(c.requirement||c.property||c.profile?.project||'—')}</b></div><div class="wide"><small>Message</small><b>${esc(c.message||'—')}</b></div>${c.profile?`<div class="wide"><small>Design Profile</small><pre style="white-space:pre-wrap;font:12px inherit">${esc(JSON.stringify(c.profile,null,2))}</pre></div>`:''}`;$('modal').classList.remove('hidden')}function done(id){const c=leads.find(x=>x.id===id);if(c){c.status='completed';c.lastFollowup=new Date().toISOString();save()}}function wa(phone,name){let p=String(phone).replace(/\D/g,'');if(p.length===10)p='91'+p;window.open('https://wa.me/'+p+'?text='+encodeURIComponent('Hi '+name+', this is Linva Interiors. Following up regarding your interior enquiry.'),'_blank','noopener')}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['dashboard','leads','followups'].forEach(v=>$(v).classList.add('hidden'));const v=b.dataset.view;$(v).classList.remove('hidden');$('title').textContent=v==='dashboard'?'Lead Dashboard':v==='leads'?'Customers & Leads':'Follow-Ups';render()});['search','source','status','range','fp'].forEach(id=>$(id).addEventListener('input',render));$('close').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.add('hidden')};$('add').onclick=()=>{const name=prompt('Customer name');if(!name)return;const phone=prompt('WhatsApp number');if(!phone)return;leads.push({id:'manual_'+Date.now(),source:'Manual',name,phone:phone.replace(/\D/g,''),priority:'medium',status:'pending',followup:new Date(Date.now()+864e5).toISOString(),createdAt:new Date().toISOString()});save()};load();render();window.addEventListener('storage',function(e){if(e.key==='linva_crm_leads')render()});
</script></body></html>
