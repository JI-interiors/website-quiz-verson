<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="noindex,nofollow,noarchive,nosnippet" name="robots"/><meta content="noindex,nofollow,noarchive,nosnippet" name="googlebot"/><meta content="noindex,nofollow,noarchive,nosnippet" name="googlebot-news"/><title>Linva Interiors CRM</title><link href="crm.css" rel="stylesheet"/></head><body><div class="shell"><aside class="side"><div class="logo"><img alt="Linva Interiors" height="140" src="../images/linva-interiors-logo.svg" width="500"/></div><div class="nav"><button class="active" data-view="dashboard">Dashboard</button><button data-view="leads">Leads</button><button data-view="followups">Follow-Ups</button></div><a class="back" href="../index.html">← Back to website</a></aside><main class="main"><div class="head"><div><div class="ey">LINVA INTERIORS CRM</div><h1 id="title">Lead Dashboard</h1></div><div style="display:flex;gap:8px;align-items:center"><button class="btn" id="add">+ Add Lead</button><button class="small" id="logout" type="button">Sign out</button></div></div><section id="dashboard"><div class="stats"><div class="stat"><span>Total Leads</span><b id="total">0</b></div><div class="stat"><span>Follow-Ups Today</span><b id="today">0</b></div><div class="stat"><span>Overdue</span><b id="overdue">0</b></div><div class="stat"><span>High Priority</span><b id="high">0</b></div></div><div class="card"><h2>Upcoming Follow-Ups</h2><div id="upcoming"></div></div></section><section class="hidden" id="leads"><div class="toolbar"><input aria-label="Search leads by name, phone or location" id="search" placeholder="Search name, phone, location..."/><select aria-label="Filter leads by source" id="source"><option value="all">All sources</option><option>Website Free Home Visit</option><option>Design Discovery Quiz</option><option>Website Budget Calculator</option><option>WhatsApp</option><option>Instagram</option><option>Facebook</option><option>Pinterest</option><option>YouTube</option><option>LinkedIn</option><option>X</option><option>Google Ads</option><option>Manual</option></select><select aria-label="Filter leads by status" id="status"><option value="all">All statuses</option><option>pending</option><option>completed</option><option>converted</option><option>lost</option></select></div><div class="card table" id="leadTable"></div></section><section class="hidden" id="followups"><div class="toolbar"><select aria-label="Filter leads by date range" id="range"><option value="all">All</option><option value="today">Today</option><option value="overdue">Overdue</option><option value="next7">Next 7 days</option></select><select aria-label="Filter follow-ups" id="fp"><option value="all">All priorities</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></div><div class="card table" id="followTable"></div></section></main></div><div class="modal hidden" id="modal"><div class="modalbox"><div class="modalhead"><div><div class="ey">LEAD PROFILE</div><h2 id="mname"></h2></div><button aria-label="Close lead details" class="x" id="close">×</button></div><div class="details" id="details"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://mcnmkhlmplzcacyuaitq.supabase.co';
const SUPABASE_KEY='sb_publishable_UeKXJgDg1NEFqCTn_Ux6rQ_UpCxfuYU';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let leads=[];const $=id=>document.getElementById(id);const rank={high:0,medium:1,low:2};
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function dt(v){return v?new Date(v).toLocaleString([],{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}
function today(v){return v&&new Date(v).toDateString()===new Date().toDateString()}
function overdue(c){return c.status==='pending'&&c.followup_at&&new Date(c.followup_at)<new Date()}
function sorted(a){return [...a].sort((x,y)=>(new Date(x.followup_at||'2999-01-01')-new Date(y.followup_at||'2999-01-01'))||rank[x.priority]-rank[y.priority])}
function row(c){return `<tr><td><b>${esc(c.name)}</b><div>${esc(c.source||'')}</div></td><td>${esc(c.phone)}</td><td>${esc(c.location||c.property_type||c.profile?.project||'—')}</td><td><span class="priority ${esc(c.priority)}">${esc(c.priority)}</span></td><td>${dt(c.followup_at)}</td><td><span class="badge">${esc(c.status)}</span></td><td><div class="actions"><button class="small" onclick="openLead('${c.id}')">View</button><button class="small" onclick="done('${c.id}')">Done</button><button class="small" onclick="wa('${esc(c.phone)}','${esc(c.name)}')">WhatsApp</button></div></td></tr>`}
function table(list){return list.length?`<table><thead><tr><th>Customer</th><th>WhatsApp</th><th>Project</th><th>Priority</th><th>Follow-Up</th><th>Status</th><th>Actions</th></tr></thead><tbody>${sorted(list).map(row).join('')}</tbody></table>`:'<div class="empty">No leads found.</div>'}
async function load(){const {data,error}=await client.from('leads').select('*').order('followup_at',{ascending:true,nullsFirst:false}).order('created_at',{ascending:false});if(error)throw error;leads=data||[];render()}
function render(){ $('total').textContent=leads.length;$('today').textContent=leads.filter(c=>c.status==='pending'&&today(c.followup_at)).length;$('overdue').textContent=leads.filter(overdue).length;$('high').textContent=leads.filter(c=>c.status==='pending'&&c.priority==='high').length;const up=sorted(leads.filter(c=>c.status==='pending'&&c.followup_at)).slice(0,8);$('upcoming').innerHTML=table(up);let q=($('search')?.value||'').toLowerCase(),src=$('source')?.value||'all',st=$('status')?.value||'all';$('leadTable').innerHTML=table(leads.filter(c=>(!q||[c.name,c.phone,c.location,c.property_type,c.message].join(' ').toLowerCase().includes(q))&&(src==='all'||c.source===src)&&(st==='all'||c.status===st)));let r=$('range')?.value||'all',fp=$('fp')?.value||'all';let f=leads.filter(c=>c.status==='pending'&&c.followup_at&&(fp==='all'||c.priority===fp));if(r==='today')f=f.filter(c=>today(c.followup_at));if(r==='overdue')f=f.filter(overdue);if(r==='next7'){let n=Date.now()+7*864e5;f=f.filter(c=>new Date(c.followup_at)>=new Date()&&new Date(c.followup_at)<=new Date(n))}$('followTable').innerHTML=table(f)}
async function openLead(id){const c=leads.find(x=>x.id===id);if(!c)return;$('mname').textContent=c.name;$('details').innerHTML=`<div><small>WhatsApp</small><b>${esc(c.phone)}</b></div><div><small>Source</small><b>${esc(c.source)}</b></div><div><small>Priority</small><b>${esc(c.priority)}</b></div><div><small>Status</small><b>${esc(c.status)}</b></div><div><small>Upcoming Follow-Up</small><b>${dt(c.followup_at)}</b></div><div><small>Last Follow-Up</small><b>${dt(c.last_followup_at)}</b></div><div class="wide"><small>Requirement</small><b>${esc(c.requirement||c.property_type||c.profile?.project||'—')}</b></div><div class="wide"><small>Message</small><b>${esc(c.message||'—')}</b></div>${c.profile?`<div class="wide"><small>Design Profile</small><pre style="white-space:pre-wrap;font:12px inherit">${esc(JSON.stringify(c.profile,null,2))}</pre></div>`:''}`;$('modal').classList.remove('hidden')}
async function done(id){const {error}=await client.from('leads').update({status:'completed',last_followup_at:new Date().toISOString()}).eq('id',id);if(error){alert('Could not update lead.');return}await load()}
function wa(phone,name){let p=String(phone).replace(/\D/g,'');if(p.length===10)p='91'+p;window.open('https://wa.me/'+p+'?text='+encodeURIComponent('Hi '+name+', this is Linva Interiors. Following up regarding your interior enquiry.'),'_blank','noopener')}
async function addLead(){const name=prompt('Customer name');if(!name)return;const phone=prompt('WhatsApp number');if(!phone)return;const {error}=await client.from('leads').insert({source:'Manual',name:name.trim(),phone:phone.replace(/\D/g,''),priority:'medium',status:'pending',followup_at:new Date(Date.now()+864e5).toISOString()});if(error){alert('Could not add lead.');return}await load()}
async function showLogin(){document.body.innerHTML=`<main style="min-height:100vh;display:grid;place-items:center;padding:20px;background:#f7f2f5"><form id="login" style="background:#fff;padding:28px;border-radius:18px;width:min(420px,100%);box-shadow:0 12px 40px #32102414"><div role="heading" aria-level="2" style="margin:0 0 8px;font-size:2em;font-weight:700">Linva Interiors CRM</div><p>Sign in to manage leads.</p><input id="email" type="email" aria-label="CRM email address" autocomplete="username" placeholder="CRM email" required style="width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px"><input id="password" type="password" aria-label="CRM password" autocomplete="current-password" placeholder="CRM password" required style="width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px"><button style="width:100%;padding:12px;border:0;border-radius:8px;background:#321024;color:#fff;font-weight:800">Sign in</button><p id="loginError" style="color:#b21d36"></p></form></main>`;$('login').onsubmit=async e=>{e.preventDefault();const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginError').textContent=error.message;return}location.reload()}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['dashboard','leads','followups'].forEach(v=>$(v).classList.add('hidden'));const v=b.dataset.view;$(v).classList.remove('hidden');$('title').textContent=v==='dashboard'?'Lead Dashboard':v==='leads'?'Customers & Leads':'Follow-Ups';render()});['search','source','status','range','fp'].forEach(id=>$(id).addEventListener('input',render));$('close').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.add('hidden')};$('add').onclick=addLead;$('logout').onclick=async()=>{await client.auth.signOut();location.reload()};
(async()=>{const {data:{session}}=await client.auth.getSession();if(!session){await showLogin();return}try{await load()}catch(e){document.body.insertAdjacentHTML('afterbegin',`<div style="position:fixed;top:0;left:0;right:0;background:#b21d36;color:#fff;padding:10px;text-align:center;z-index:99">CRM database could not be loaded. ${esc(e.message)}</div>`);}})();
</script><script defer="" src="../analytics.js"></script></body></html>
