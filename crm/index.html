<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet"><meta name="googlebot-news" content="noindex,nofollow,noarchive,nosnippet"><title>Linva Interiors CRM</title><link rel="stylesheet" href="crm.css?v=87"></head><body>
<div class="shell"><aside class="side"><div class="logo"><img src="../images/linva-interiors-logo.webp" alt="Linva Interiors"></div><div class="nav"><button class="active" data-view="dashboard">Dashboard</button><button data-view="leads">Leads</button><button data-view="followups">Follow-Ups</button></div><a class="back" href="../index.html">← Back to website</a></aside>
<main class="main"><div class="head"><div><div class="ey">LINVA INTERIORS CRM</div><h1 id="title">Lead Dashboard</h1><small id="userLabel"></small></div><div class="head-actions"><button class="btn" id="add">+ Add Lead</button><button class="small" id="logout" type="button">Sign out</button></div></div>
<section id="dashboard"><div class="stats"><div class="stat"><span>Total Leads</span><b id="total">0</b></div><div class="stat"><span>Follow-Ups Today</span><b id="today">0</b></div><div class="stat"><span>Overdue</span><b id="overdue">0</b></div><div class="stat"><span>High Priority</span><b id="high">0</b></div></div><div class="card"><h2>Upcoming Follow-Ups</h2><div id="upcoming"></div></div></section>
<section id="leads" class="hidden"><div class="toolbar"><input id="search" placeholder="Search name, phone, location..."><select id="source"><option value="all">All sources</option><option>Website Free Home Visit</option><option>Design Discovery Quiz</option><option>Website Budget Calculator</option><option>WhatsApp</option><option>Instagram</option><option>Facebook</option><option>Pinterest</option><option>YouTube</option><option>LinkedIn</option><option>X</option><option>Google Ads</option><option>Manual</option></select><select id="status"><option value="all">All statuses</option><option>pending</option><option>completed</option><option>converted</option><option>lost</option></select></div><div class="card table" id="leadTable"></div></section>
<section id="followups" class="hidden"><div class="toolbar"><select id="range"><option value="all">All</option><option value="today">Today</option><option value="overdue">Overdue</option><option value="next7">Next 7 days</option></select><select id="fp"><option value="all">All priorities</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></div><div class="card table" id="followTable"></div></section></main></div>
<div class="modal hidden" id="modal"><div class="modalbox"><div class="modalhead"><div><div class="ey">LEAD PROFILE</div><h2 id="mname"></h2></div><button class="x" id="close" type="button">×</button></div><div id="details" class="details"></div></div></div>
<div class="modal hidden" id="editModal"><form class="modalbox editbox" id="editForm"><div class="modalhead"><div><div class="ey">EDIT LEAD</div><h2>Customer details</h2></div><button class="x" id="editClose" type="button">×</button></div><input type="hidden" id="editId"><div class="edit-grid"><label>Name<input id="editName" required></label><label>WhatsApp<input id="editPhone" inputmode="tel" required></label><label>Source<select id="editSource"><option>Website Free Home Visit</option><option>Design Discovery Quiz</option><option>Website Budget Calculator</option><option>WhatsApp</option><option>Instagram</option><option>Facebook</option><option>Pinterest</option><option>YouTube</option><option>LinkedIn</option><option>X</option><option>Google Ads</option><option>Manual</option></select></label><label>Priority<select id="editPriority"><option>high</option><option>medium</option><option>low</option></select></label><label>Status<select id="editStatus"><option>pending</option><option>completed</option><option>converted</option><option>lost</option></select></label><label>Follow-Up<input id="editFollowup" type="datetime-local"></label><label class="wide">Requirement<input id="editRequirement"></label><label class="wide">Message<textarea id="editMessage" rows="4"></textarea></label></div><div class="edit-actions"><button class="small" type="button" id="editCancel">Cancel</button><button class="btn" type="submit">Save Changes</button></div></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="crm.js?v=87" defer></script></body></html>
